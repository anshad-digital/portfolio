name: Sync Medium RSS Articles

on:
  schedule:
    # Runs automatically every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Enables manual on-demand trigger via GitHub Actions tab

permissions:
  contents: write # Required permission to commit updated article data safely

jobs:
  sync-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Medium RSS Sync
        run: node scripts/sync-medium.js

      - name: Build Minified Production Assets
        run: node build.js

      - name: Commit & Push If New Articles Found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/medium-config.json style.min.css main.min.css script.min.js
          git diff --staged --quiet || (git commit -m "chore(blog): sync new Medium articles" && git push origin main)
